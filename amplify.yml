version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - node --version
        - npm --version
    build:
      commands:
        - npm install --no-audit --no-fund
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
frontend:
  phases:
    build:
      commands:
        - test -s amplify_outputs.json || (echo "ERROR: Backend outputs missing; inspect Amplify backend build log" && exit 1)
        - cp amplify_outputs.json public/amplify_outputs.json
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
